<title>DFG 展示ページ生成ツール v17</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;600&family=Noto+Sans+JP:wght@300;400;500;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=M+PLUS+Rounded+1c:wght@400;700;800&family=BIZ+UDMincho&family=Zen+Old+Mincho:wght@400;700&family=RocknRoll+One&family=Kaisei+Opti&family=Cinzel:wght@400;600;700&family=Special+Elite&family=Rubik+Mono+One&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script type="module">
// Firebase設定
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
import { getFirestore, collection, deleteDoc, doc, onSnapshot, orderBy, query }
  from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAFdBPTqPUwHALpFYxy1L-XgxaFcHJpKrI",
  authDomain: "dfg-message-board.firebaseapp.com",
  projectId: "dfg-message-board",
  storageBucket: "dfg-message-board.firebasestorage.app",
  messagingSenderId: "257856032842",
  appId: "1:257856032842:web:07ff7a53077326845f96b3"
};
const _app = initializeApp(firebaseConfig);
const _db  = getFirestore(_app);

window._generatorDb = _db;
window._generatorDeleteDoc = deleteDoc;
window._generatorDoc = doc;

// generator_pages をリアルタイム購読し、常に最新の状態に同期する
// 各ページには Firestore の docId を保持し、既存の手動編集内容（テーマ・向き・本文サイズ）は
// docId が一致するページについて維持する
const q = query(collection(_db, 'generator_pages'), orderBy('createdAt', 'asc'));
onSnapshot(q, snap => {
  console.log('[DEBUG] onSnapshot fired at', new Date().toISOString());
  const docs = snap.docs.map(d => ({ id: d.id, ...d.data() }));

  const prevByDocId = {};
  (window._pages || []).forEach(p => { if (p.docId) prevByDocId[p.docId] = p; });

  window._pages.length = 0;
  docs.forEach(item => {
    const prev = prevByDocId[item.id];
    if (prev) {
      window._pages.push(prev);
    } else {
      window._pages.push({
        docId: item.id,
        data: window._parseText(item.raw || ''),
        theme: 'default',
        orient: 'landscape',
        bodySize: null,
      });
    }
  });

  window._renderAll();
});

// Firestoreからページのドキュメントを削除（×ボタン・印刷後の自動削除で使用）
window.deleteGeneratorPageDoc = async function(docId) {
  if (!docId) return;
  try {
    await deleteDoc(doc(_db, 'generator_pages', docId));
  } catch(e) { console.error(e); }
};
</script>

/* ===== PRINT ===== */
@media print {
  html, body { margin: 0 !important; padding: 0 !important; background: white !important; width: 100% !important; }
  #editor-panel, #sidebar-resizer, .preview-toolbar { display: none !important; }
  #app { display: block !important; margin: 0 !important; padding: 0 !important; width: 100% !important; }
  #preview-panel { display: block !important; margin: 0 !important; padding: 0 !important; width: 100% !important; background: none !important; }
  #pageContainer { display: block !important; margin: 0 !important; padding: 0 !important; gap: 0 !important; background: none !important; }
  .a4-sheet { box-shadow: none !important; margin: 0 !important; display: flex !important; }
  .a4-sheet-portrait { box-shadow: none !important; margin: 0 !important; display: flex !important; }

  /* 名前付き@pageで横縦を個別に制御 */
  @page landscape { size: A4 landscape; margin: 0; }
  @page portrait  { size: A4 portrait;  margin: 0; }
  .a4-sheet          { page: landscape; }
  .a4-sheet-portrait { page: portrait; }

  /* 印刷時に重いCSS効果を無効化 */

  .theme-gothic .a5-page,
  .theme-gothic .a5-land { background-image: none !important; }
  .theme-punk .a5-page,
  .theme-punk .a5-land { background-image: none !important; }
  .theme-horror .ex-title,
  .theme-horror .art-name,
  .theme-gothic .ex-title { text-shadow: none !important; }
  .theme-horror .qr-wrap canvas, .theme-horror .qr-wrap img,
  .theme-gothic .qr-wrap canvas, .theme-gothic .qr-wrap img,
  .theme-punk .qr-wrap canvas,   .theme-punk .qr-wrap img { filter: none !important; }
}

/* 背景色・背景画像を印刷時も強制出力 */
* {
  -webkit-print-color-adjust: exact !important;
  print-color-adjust: exact !important;
  color-adjust: exact !important;
}
</style>
</head>
<body>
<div id="app">
  <!-- LEFT PANEL -->
  <div id="editor-panel" translate="no">
    <div class="editor-header">
      <h1>DFG Exhibition Generator</h1>
      <p>DESIGN FESTA GALLERY — 展示ページ生成ツール</p>
    </div>
    <div style="font-size:11px;color:#4a9;letter-spacing:0.05em;padding:8px 0;">🔄 DFGメッセージボードで取り込んだ展示が自動的に表示されます</div>
    <details style="margin-top:2px;">
      <summary style="font-size:11px;color:#aaa;cursor:pointer;letter-spacing:0.08em;list-style:none;padding:3px 0;">🔖 ブックマークレット（最新版）</summary>
      <textarea id="bookmarkletCode" readonly style="width:100%;height:60px;margin-top:6px;background:#0a0a0a;color:#4a9;border:1px solid #2a2a2a;border-radius:3px;font-size:9px;padding:6px;resize:none;font-family:monospace;line-height:1.4;" onclick="this.select()"></textarea>
      <button onclick="navigator.clipboard.writeText(document.getElementById('bookmarkletCode').value).then(()=>{this.textContent='✓ コピー済み';setTimeout(()=>this.textContent='📋 コピー',1500)})" style="margin-top:4px;width:100%;padding:5px;background:transparent;border:1px solid #2a2a2a;color:#aaa;font-size:11px;border-radius:3px;cursor:pointer;">📋 コピー</button>
    </details>
    <hr class="divider">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-shrink:0;">
      <label style="margin:0;">展示内容 文字サイズ</label>
      <div style="display:flex;align-items:center;gap:6px;">
        <button onclick="adjustLongBodySize(-0.5)" style="width:24px;height:24px;background:#0a0a0a;border:1px solid #2a2a2a;border-radius:3px;color:#aaa;font-size:14px;cursor:pointer;line-height:1;">−</button>
        <span id="longBodySizeLabel" style="font-size:12px;color:#e0dbd3;min-width:34px;text-align:center;">13px</span>
        <button onclick="adjustLongBodySize(0.5)" style="width:24px;height:24px;background:#0a0a0a;border:1px solid #2a2a2a;border-radius:3px;color:#aaa;font-size:14px;cursor:pointer;line-height:1;">＋</button>
      </div>
    </div>
    <hr class="divider">
    <div class="list-header">
      <label style="margin:0">追加済みページ</label>
      <span class="page-count" id="pageCount">0 ページ</span>
    </div>
    <div id="bulkTheme" style="display:none; flex-direction:column; gap:3px; padding:4px 0 2px;">
      <span style="font-size:11px;color:#aaa;letter-spacing:0.08em;">一括テーマ変更</span>
      <div style="display:flex;gap:3px;">
        <button class="theme-mini-btn" onclick="applyAllTheme('default')">📄</button>
        <button class="theme-mini-btn" onclick="applyAllTheme('pop')">🎨</button>
        <button class="theme-mini-btn" onclick="applyAllTheme('photo')">🖼</button>
        <button class="theme-mini-btn" onclick="applyAllTheme('grid')">📐</button>
        <button class="theme-mini-btn" onclick="applyAllTheme('news')">📰</button>
      </div>
      <div style="display:flex;gap:3px;">
        <button class="theme-mini-btn" onclick="applyAllTheme('collage')">✂️</button>
        <button class="theme-mini-btn" onclick="applyAllTheme('retro')">📮</button>
        <button class="theme-mini-btn" onclick="applyAllTheme('horror')">🩸</button>
        <button class="theme-mini-btn" onclick="applyAllTheme('gothic')">⛪</button>
        <button class="theme-mini-btn" onclick="applyAllTheme('punk')">⚡</button>
      </div>
    </div>
    <div id="pageList"><div class="empty-list">まだページがありません</div></div>
  </div>

  <div id="sidebar-resizer" title="ドラッグして幅を調整"></div>
  <!-- RIGHT PANEL -->
  <div id="preview-panel">
    <div class="preview-toolbar" translate="no">
      <span class="translate-hint">💡 ブラウザの翻訳機能で右側が英語になります</span>
      <span class="page-counter-badge" id="counterBadge">0 ページ</span>
      <button class="btn-print" onclick="window.print()">🖨 印刷</button>
      <button class="btn-print" style="background:#5a4a3a;" onclick="cleanupAllPages()">🗑 印刷完了・一覧から削除</button>
    </div>
    <div id="pageContainer">
      <div class="a4-sheet theme-default">
        <div class="a5-page a5-ja">
          <div class="empty-state"><div class="icon">✦</div><p>データを追加してください</p></div>
        </div>
        <div class="a5-divider"></div>
        <div class="a5-page a5-en">
          <div class="empty-state"><div class="icon">✦</div><p>右側が英語訳になります</p></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const pages = [];

const POP_VARIANTS = [
  { headerBg:'#ff4d6d', headerTxt:'#fff', titleBg:'#fff9c4', accent:'#ff4d6d', sec:'#ff4d6d', longBg:'#f0fafa', longBorder:'#4ecdc4', artBg:'#fff9c4', infoBorder:'#ffd6de', dotColor:'#ff4d6d' },
  { headerBg:'#2196f3', headerTxt:'#fff', titleBg:'#e8f5e9', accent:'#2196f3', sec:'#2196f3', longBg:'#f1f8e9', longBorder:'#66bb6a', artBg:'#e8f5e9', infoBorder:'#bbdefb', dotColor:'#2196f3' },
  { headerBg:'#9c27b0', headerTxt:'#fff', titleBg:'#fff3e0', accent:'#9c27b0', sec:'#9c27b0', longBg:'#fff8f0', longBorder:'#ff9800', artBg:'#fff3e0', infoBorder:'#e1bee7', dotColor:'#9c27b0' },
];

function popBgSVG(color, idx) {
  const pats = [
    `<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><circle cx="10" cy="10" r="2.5" fill="${color}" opacity="0.07"/><circle cx="50" cy="50" r="2.5" fill="${color}" opacity="0.07"/><circle cx="90" cy="90" r="2.5" fill="${color}" opacity="0.07"/><circle cx="10" cy="90" r="2.5" fill="${color}" opacity="0.07"/><circle cx="90" cy="10" r="2.5" fill="${color}" opacity="0.07"/></svg>`,
    `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20"><line x1="0" y1="20" x2="20" y2="0" stroke="${color}" stroke-width="1" opacity="0.07"/></svg>`,
    `<svg xmlns="http://www.w3.org/2000/svg" width="30" height="30"><text x="15" y="20" text-anchor="middle" font-size="12" fill="${color}" opacity="0.08">★</text></svg>`,
  ];
  return `data:image/svg+xml;charset=utf-8,${encodeURIComponent(pats[idx % pats.length])}`;
}

function parseText(raw) {
  const lines = raw.split('\n').map(l => l.trim()).filter(l => l.length > 0);
  const d = { title:'', space:'', floor:'', period:'', genre:'', content:'', concept:'', artistName:'', members:'', profile:'', sns:'' };
  const KEYS = { 'スペース':'space','会期':'period','ジャンル':'genre','展示内容':'content','展示コンセプト':'concept','アーティスト名':'artistName','メンバー構成':'members','プロフィール':'profile','SNS':'sns','展示情報':null,'アーティスト情報':null };
  let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    if (/^「.+」$/.test(line)) { d.title = line.replace(/^「|」$/g, ''); i++; continue; }
    if (line === '展示情報' && i > 0 && !d.title) { d.title = lines[i-1]; i++; continue; }
    if (/^https?:\/\//.test(line)) { if (!d.sns) d.sns = line; i++; continue; }
    if (line === 'スペース') {
      if (lines[i+1]) d.space = lines[i+1];
      if (lines[i+2] && !/^展示|^アーティスト|^会期|^ジャンル|^スペース/.test(lines[i+2])) { d.floor = lines[i+2]; i += 3; } else { i += 2; }
      continue;
    }
    if (KEYS[line] !== undefined) {
      const key = KEYS[line];
      if (key === null) { i++; continue; }
      if (key === 'sns') { if (lines[i+1] && /^https?:\/\//.test(lines[i+1])) { d.sns = lines[i+1]; i += 2; } else { i++; } continue; }
      i++;
      let val = '';
      while (i < lines.length && KEYS[lines[i]] === undefined && !/^「.+」$/.test(lines[i]) && !/^https?:\/\//.test(lines[i])) { val += (val ? '\n' : '') + lines[i]; i++; }
      d[key] = val.trim();
      continue;
    }
    i++;
  }
  return d;
}

function buildA5Inner(d, num, total, isJa, theme, pageIdx) {
  const today = new Date().toLocaleDateString('ja-JP', { year:'numeric', month:'long', day:'numeric' });
  const infoRows = [['会期', d.period], ['ジャンル', d.genre]].filter(([,v]) => v);
  const infoHtml = infoRows.map(([k,v]) => `<div class="i-key">${k}</div><div class="i-val">${v}</div>`).join('');
  const longBlocks = [['展示内容', d.content], ['展示コンセプト', d.concept]].filter(([,v]) => v);
  const longHtml = longBlocks.map(([lbl, v]) => `<div class="long-blk"><div class="long-lbl">${lbl}</div><div class="long-body">${v.replace(/\n/g,'<br>')}</div></div>`).join('');

  if (theme === 'default') {
    return `
      <div class="pg-header">
        <div class="g-logo">Design Festa Gallery<span>Harajuku, Tokyo</span></div>
      </div>
      <div class="ttl-block">
        <div class="ex-label">Exhibition</div>
        <div class="ex-title">${d.title || '（タイトル未取得）'}</div>
        <div class="ttl-line"></div>
      </div>
      ${infoRows.length ? `<div class="info-sec"><div class="sec-head">Details</div><div class="info-grid">${infoHtml}</div></div>` : ''}
      ${longBlocks.length ? `<div class="long-sec">${longHtml}</div>` : ''}
      <div class="art-sec">
        <div class="sec-head">Artist</div>
        <div class="art-inner">
          <div>
            ${buildArtistInner(d)}
          </div>
          ${buildSpaceBadge(d.space, d.floor)}
        </div>
      </div>`;
  }

  if (theme === 'pop') {
    const v = POP_VARIANTS[pageIdx % POP_VARIANTS.length];
    const bgUrl = popBgSVG(v.dotColor, pageIdx);
    const infoHtmlPop = infoRows.map(([k,val]) => `<div class="i-key" style="color:${v.accent}">${k}</div><div class="i-val">${val}</div>`).join('');
    const longHtmlPop = longBlocks.map(([lbl, val]) => `<div class="long-blk"><div class="long-lbl" style="background:${v.longBorder}">${lbl}</div><div class="long-body" style="background:${v.longBg};border-left-color:${v.longBorder}">${val.replace(/\n/g,'<br>')}</div></div>`).join('');
    return `
      <div class="pop-bg" style="background-image:url('${bgUrl}');background-repeat:repeat;"></div>
      <div class="pop-content">
        <div class="pg-header" style="background:${v.headerBg};margin:-12mm -12mm 5mm;padding:2.5mm 12mm;">
          <div class="g-logo" style="color:${v.headerTxt}">Design Festa Gallery</div>
        </div>
        <div class="ttl-block" style="background:${v.titleBg}">
          <div class="ex-label" style="color:${v.accent}">Exhibition</div>
          <div class="ex-title">${d.title || '（タイトル未取得）'}</div>
        </div>
        ${infoRows.length ? `<div class="info-sec"><div class="sec-head" style="background:${v.sec}">Details</div><div class="info-grid">${infoHtmlPop}</div></div>` : ''}
        ${longBlocks.length ? `<div class="long-sec">${longHtmlPop}</div>` : ''}
        <div class="art-sec" style="background:${v.artBg}">
          <div class="sec-head" style="background:${v.sec}">Artist</div>
          <div class="art-inner">
            <div>
              ${buildArtistInner(d, { snsColor: v.accent })}
            </div>
            ${buildSpaceBadge(d.space, d.floor, { valColor: v.accent, lblColor: '#666', floorColor: '#666' })}
          </div>
        </div>
      </div>`;
  }

  if (theme === 'photo') {
    const infoHtmlPhoto = infoRows.map(([k,v]) => `<div class="i-key">${k}</div><div class="i-val">${v}</div>`).join('');
    const longHtmlPhoto = longBlocks.map(([lbl, v]) => `<div class="long-blk"><div class="long-lbl">${lbl}</div><div class="long-body">${v.replace(/\n/g,'<br>')}</div></div>`).join('');
    return `
      <div class="photo-stripe"></div>
      <div class="pg-header">
        <div class="g-logo">Design Festa Gallery<span>Harajuku, Tokyo</span></div>
      </div>
      <div class="ttl-block">
        <div class="ttl-corner tl"></div><div class="ttl-corner tr"></div>
        <div class="ttl-corner bl"></div><div class="ttl-corner br"></div>
        <div class="ex-label">Exhibition</div>
        <div class="ex-title">${d.title || '（タイトル未取得）'}</div>
      </div>
      ${infoRows.length ? `<div class="info-sec"><div class="sec-head">Details</div><div class="info-grid">${infoHtmlPhoto}</div></div>` : ''}
      ${longBlocks.length ? `<div class="long-sec">${longHtmlPhoto}</div>` : ''}
      <div class="art-sec">
        <div class="photo-corner tl"></div><div class="photo-corner tr"></div>
        <div class="photo-corner bl"></div><div class="photo-corner br"></div>
        <div class="sec-head">Artist</div>
        <div class="art-inner">
          <div>
            ${buildArtistInner(d)}
          </div>
          ${buildSpaceBadge(d.space, d.floor)}
        </div>
      </div>`;
  }
  if (theme === 'grid')    return buildGrid(d);
  if (theme === 'news')    return buildNews(d);
  if (theme === 'collage') return buildCollage(d);
  if (theme === 'retro')   return buildRetro(d);
  if (theme === 'horror')  return buildHorror(d);
  if (theme === 'gothic')  return buildGothic(d);
  if (theme === 'punk')    return buildPunk(d, pageIdx);
}

function buildHorror(d) {
  const infoRows   = [['会期', d.period], ['ジャンル', d.genre]].filter(([,v]) => v);
  const longBlocks = [['展示内容', d.content], ['展示コンセプト', d.concept]].filter(([,v]) => v);
  return `
    <div class="horror-tape"></div>
    <div class="horror-blood-drip1"></div>
    <div class="horror-blood-drip2"></div>
    <div class="horror-blood-splat"></div>
    <div class="horror-blood-dot1"></div>
    <div class="horror-blood-dot2"></div>
    <div class="pg-header"><div class="g-logo">Design Festa Gallery</div></div>
    <div class="ttl-block">
      <div class="ex-label">Exhibition</div>
      <div class="ex-title">${d.title||'（タイトル未取得）'}</div>
      <div class="ttl-line"></div>
    </div>
    ${infoRows.length ? `<div class="info-sec"><div class="sec-head">Details</div><div class="info-grid">${infoRows.map(([k,v])=>`<div class="i-key">${k}</div><div class="i-val">${v}</div>`).join('')}</div></div>` : ''}
    ${longBlocks.length ? `<div class="long-sec">${longBlocks.map(([lbl,v])=>`<div class="long-blk"><div class="long-lbl">${lbl}</div><div class="long-body">${v.replace(/\n/g,'<br>')}</div></div>`).join('')}</div>` : ''}
    <div class="art-sec"><div class="art-inner"><div>${buildArtistInner(d)}</div>${buildSpaceBadge(d.space, d.floor)}</div></div>`;
}

function buildGothic(d) {
  const infoRows   = [['会期', d.period], ['ジャンル', d.genre]].filter(([,v]) => v);
  const longBlocks = [['展示内容', d.content], ['展示コンセプト', d.concept]].filter(([,v]) => v);
  return `
    <div class="gothic-arch"></div>
    <div class="gothic-corner tl"></div><div class="gothic-corner tr"></div>
    <div class="gothic-corner bl"></div><div class="gothic-corner br"></div>
    <div class="pg-header">
      <div class="hd-deco">Design Festa Gallery — Harajuku</div>
      <div class="g-logo">DESIGN FESTA GALLERY</div>
    </div>
    <div class="ttl-block">
      <div class="ex-label">Exhibition</div>
      <div class="gothic-ornament">✦ ✦ ✦</div>
      <div class="ex-title">${d.title||'（タイトル未取得）'}</div>
    </div>
    ${infoRows.length ? `<div class="info-sec"><div class="sec-head">Details</div><div class="info-grid">${infoRows.map(([k,v])=>`<div class="i-key">${k}</div><div class="i-val">${v}</div>`).join('')}</div></div>` : ''}
    ${longBlocks.length ? `<div class="long-sec">${longBlocks.map(([lbl,v])=>`<div class="long-blk"><div class="long-lbl">${lbl}</div><div class="long-body">${v.replace(/\n/g,'<br>')}</div></div>`).join('')}</div>` : ''}
    <div class="art-sec">
      <div class="art-ornament">— ✦ —</div>
      <div class="art-inner"><div>${buildArtistInner(d)}</div>${buildSpaceBadge(d.space, d.floor)}</div>
    </div>`;
}

function buildPunk(d, pageIdx) {
  const variantIdx = pageIdx % 3;
  const infoRows   = [['PERIOD', d.period], ['GENRE', d.genre]].filter(([,val]) => val);
  const longBlocks = [['// CONTENT', d.content], ['// CONCEPT', d.concept]].filter(([,val]) => val);
  const num = String((pageIdx % 99) + 1).padStart(2, '0');
  return `
    <div class="punk-v${variantIdx}">
    <div class="pg-header">
      <div class="g-logo">DESIGN FESTA<br>GALLERY</div>
      <div class="issue">No.${num}</div>
    </div>
    <div class="ttl-block">
      <div class="ex-label">// EXHIBITION</div>
      <div class="ex-title">${d.title||'（タイトル未取得）'}</div>
      <div class="ttl-line"></div>
    </div>
    ${infoRows.length ? `<div class="info-band"><div class="info-grid">${infoRows.map(([k,val])=>`<div class="i-key">${k}</div><div class="i-val">${val}</div>`).join('')}</div></div>` : ''}
    ${longBlocks.length ? `<div class="long-sec">${longBlocks.map(([lbl,val])=>`<div class="long-blk"><div class="long-lbl">${lbl}</div><div class="long-body">${val.replace(/\n/g,'<br>')}</div></div>`).join('')}</div>` : ''}
    <div class="art-sec"><div class="art-inner"><div>${buildArtistInner(d)}</div>${buildSpaceBadge(d.space, d.floor)}</div></div>
    </div>`;
}

function buildGrid(d) {
  const infoRows = [['会期', d.period], ['ジャンル', d.genre]].filter(([,v]) => v);
  const longBlocks = [['展示内容', d.content], ['展示コンセプト', d.concept]].filter(([,v]) => v);
  return `
    <div class="pg-header"><div class="g-logo">Design Festa Gallery</div><div class="grid-dim">A5 — 148.5×210mm</div></div>
    <div class="ttl-block"><div class="ex-label">Exhibition</div><div class="ex-title">${d.title || '（タイトル未取得）'}</div></div>
    ${infoRows.length ? `<div class="info-sec"><div class="sec-head">Details</div><div class="info-grid">${infoRows.map(([k,v])=>`<div class="i-key">${k}</div><div class="i-val">${v}</div>`).join('')}</div></div>` : ''}
    ${longBlocks.length ? `<div class="long-sec">${longBlocks.map(([lbl,v])=>`<div class="long-blk"><div class="long-lbl">${lbl}</div><div class="long-body">${v.replace(/\n/g,'<br>')}</div></div>`).join('')}</div>` : ''}
    <div class="art-sec"><div class="art-inner"><div>${buildArtistInner(d)}</div>${buildSpaceBadge(d.space, d.floor)}</div></div>`;
}

function buildNews(d) {
  const today = new Date();
  const dateStr = today.toLocaleDateString('ja-JP',{year:'numeric',month:'long'});
  return `
    <div class="news-masthead">
      <div class="masthead-title">Design Festa Gallery</div>
      <div class="masthead-sub">Harajuku Exhibition Bulletin</div>
      <div class="dateline"><span>${dateStr}</span><span>${d.period||''}</span><span>Harajuku, Tokyo</span></div>
    </div>
    <div class="news-cols">
      <div class="news-col">
        <div class="ex-title">${d.title||'（タイトル未取得）'}</div>
        <div class="byline">${d.artistName||'—'} · Space ${d.space||'—'}</div>
        ${d.content?`<div class="kicker">展示内容</div><div class="news-body">${d.content.replace(/\n/g,'<br>')}</div>`:''}
        ${d.concept?`<div class="kicker">コンセプト</div><div class="news-body">${d.concept.replace(/\n/g,'<br>')}</div>`:''}
      </div>
      <div class="col-div"></div>
      <div class="news-col">
        <div class="kicker">展示情報</div>
        ${d.period?`<div class="info-item"><span class="ik">会期</span><span class="iv">${d.period}</span></div>`:''}
        ${d.genre?`<div class="info-item"><span class="ik">ジャンル</span><span class="iv">${d.genre}</span></div>`:''}
        ${d.floor?`<div class="info-item"><span class="ik">フロア</span><span class="iv">${d.floor}</span></div>`:''}
        <div class="art-block">
          ${buildArtistInner(d)}
          ${d.space ? (() => {
            const spaces = d.space.split(',').map(s=>s.trim()).filter(Boolean);
            const n = spaces.length;
            if (n <= 3) return `<div class="space-box">${spaces.join(' / ')}${d.floor?' · '+d.floor:''}</div>`;
            if (n <= 6) return `<div class="space-box">${spaces.join(', ')}</div>`;
            return `<div class="space-box">×${n} spaces</div>`;
          })() : ''}
        </div>
      </div>
    </div>`;
}

function buildCollage(d) {
  const infoRows = [['会期', d.period], ['ジャンル', d.genre]].filter(([,v]) => v);
  const longBlocks = [['展示内容', d.content], ['展示コンセプト', d.concept]].filter(([,v]) => v);
  return `
    <div class="tape"></div><div class="tape2"></div>
    <div class="coll-header"><div class="g-logo">DESIGN FESTA GALLERY</div><div class="issue">issue no.${String(Math.floor(Math.random()*99)+1).padStart(2,'0')}</div></div>
    <div class="ttl-block"><div class="ex-label">EXHIBITION</div><div class="ex-title">${d.title||'（タイトル未取得）'}</div><div class="ttl-line"></div></div>

}

function buildRetro(d) {
  const today = new Date();
  const mm = String(today.getMonth()+1).padStart(2,'0');
  const yyyy = today.getFullYear();
  const infoRows = [['会期', d.period], ['ジャンル', d.genre]].filter(([,v]) => v);
  const longBlocks = [['展示内容', d.content], ['展示コンセプト', d.concept]].filter(([,v]) => v);
  return `
    <div class="stamp-border"></div>
    <div class="postmark"><div class="pm-txt">DESIGN<br>FESTA</div><div class="pm-date">${mm}.${yyyy}</div><div class="pm-txt">GALLERY</div></div>
    <div class="pg-header"><div class="g-logo">Design Festa Gallery<br>原宿 · HARAJUKU</div><div class="stamp-box"><div class="stamp-inner">DFG</div></div></div>
    <div class="ttl-block"><div class="ex-label">Exhibition</div><div class="ex-title">${d.title||'（タイトル未取得）'}</div><div class="ttl-line">✦ · ✦</div></div>
    ${infoRows.length ? `<div class="info-sec"><div class="sec-head">展示情報</div><div class="info-grid">${infoRows.map(([k,v])=>`<div class="i-key">${k}</div><div class="i-val">${v}</div>`).join('')}</div></div>` : ''}
    ${longBlocks.length ? `<div class="long-sec">${longBlocks.map(([lbl,v])=>`<div class="long-blk"><div class="long-lbl">${lbl}</div><div class="long-body">${v.replace(/\n/g,'<br>')}</div></div>`).join('')}</div>` : ''}
    <div class="art-sec"><div class="art-inner"><div>${buildArtistInner(d)}</div>${buildSpaceBadge(d.space, d.floor)}</div></div>`;
}

function buildSheet(d, theme, pageIdx, num, total, orient, bodySize) {
  const inner   = buildA5Inner(d, num, total, true,  theme, pageIdx);
  const innerEn = buildA5Inner(d, num, total, false, theme, pageIdx);
  const sizeStyle = bodySize ? ` style="--long-body-size:${bodySize}px"` : '';
  if (orient === 'portrait') {
    return `
    <div class="a4-sheet-portrait theme-${theme}" id="page-${pageIdx}"${sizeStyle}>
      <div class="a5-land a5-ja" translate="no">${inner}</div>
      <div class="a5-divider-h"></div>
      <div class="a5-land a5-en">${innerEn}</div>
    </div>`;
  }
  return `
    <div class="a4-sheet theme-${theme}" id="page-${pageIdx}"${sizeStyle}>
      <div class="a5-page a5-ja" translate="no">${inner}</div>
      <div class="a5-divider"></div>
      <div class="a5-page a5-en">${innerEn}</div>
    </div>`;
}

function changeTheme(idx, theme) {
  pages[idx].theme = theme;
  renderAll();
}

function changeBodySize(idx, delta) {
  const base = pages[idx].bodySize != null ? pages[idx].bodySize : longBodySize;
  pages[idx].bodySize = Math.round((base + delta) * 10) / 10;
  pages[idx].bodySize = Math.min(20, Math.max(6, pages[idx].bodySize));
  renderAll();
}

function resetBodySize(idx) {
  pages[idx].bodySize = null;
  renderAll();
}

function changeOrient(idx, orient) {
  pages[idx].orient = orient;
  renderAll();
}

function scrollToPage(idx) {
  const el = document.getElementById('page-' + idx);
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  document.querySelectorAll('.page-list-item').forEach((item, i) => item.classList.toggle('active-item', i === idx));
}

// モジュールからアクセスできるようにグローバルに公開
window._pages = pages;
window._parseText = parseText;

// ===== SIDEBAR RESIZE =====
(function() {
  const resizer = document.getElementById('sidebar-resizer');
  const app = document.getElementById('app');
  let startX, startW;
  resizer.addEventListener('mousedown', e => {
    startX = e.clientX;
    startW = parseInt(getComputedStyle(app).gridTemplateColumns.split(' ')[0]);
    resizer.classList.add('dragging');
    document.body.style.cursor = 'col-resize';
    document.body.style.userSelect = 'none';
    e.preventDefault();
  });
  document.addEventListener('mousemove', e => {
    if (!resizer.classList.contains('dragging')) return;
    const w = Math.min(700, Math.max(300, startW + e.clientX - startX));
    app.style.setProperty('--sidebar-w', w + 'px');
  });
  document.addEventListener('mouseup', () => {
    resizer.classList.remove('dragging');
    document.body.style.cursor = '';
    document.body.style.userSelect = '';
  });
})();

// ===== スペース表示 =====
function detectZone(spaces) {
  // Art Corner系はフロア名つきなら確定
  const hasAC2F = spaces.some(s => /art corner 2f/i.test(s));
  const hasAC3F = spaces.some(s => /art corner 3f/i.test(s));
  const hasW    = spaces.some(s => /^W-\d+$/i.test(s));
  const hasE    = spaces.some(s => /^E-\d+$/i.test(s));
  const has1x   = spaces.some(s => /^1-[A-Z]$/i.test(s));
  const has2x   = spaces.some(s => /^2-[A-Z]$/i.test(s));
  const has10x  = spaces.some(s => /^101(-[ab])?$|^102$/.test(s));
  const has20x  = spaces.some(s => /^20[1-4]$/.test(s));
  const has30x  = spaces.some(s => /^30[1-4]$/.test(s));
  if (hasW)   return 'artpieceWEST';
  if (hasE)   return 'artpieceEAST';
  if (has1x)  return 'WEST館 1F';
  if (has2x)  return 'WEST館 2F';
  if (has10x) return 'EAST館 1F';
  if (has20x || hasAC2F) return 'EAST館 2F';
  if (has30x || hasAC3F) return 'EAST館 3F';
  return '';
}

function applyAllTheme(theme) {
  pages.forEach(p => p.theme = theme);
  renderAll();
}

function buildArtistInner(d, opts = {}) {
  const { nameColor = '', metaColor = '', snsColor = '' } = opts;
  const nameStyle  = nameColor  ? ` style="color:${nameColor}"` : '';
  const metaStyle  = metaColor  ? ` style="color:${metaColor}"` : '';

  const membersHtml = d.members
    ? `<div class="members-list">${d.members.split(',').map(m => m.trim()).filter(Boolean).map(m => `<span class="member-tag"${metaStyle}>${m}</span>`).join('')}</div>`
    : '';

  // SNSはQRコードプレースホルダー（data属性にURLを持たせてあとでJS生成）
  const snsHtml = d.sns
    ? `<div class="qr-wrap" data-qr="${d.sns}"><div class="qr-img"></div><div class="qr-label">${d.sns.replace(/^https?:\/\//, '')}</div></div>`
    : '';

  return `
    <div class="art-name"${nameStyle}>${d.artistName || '—'}</div>
    ${membersHtml}
    ${d.profile ? `<div class="art-meta"${metaStyle}>${d.profile}</div>` : ''}
    ${snsHtml}`;
}

function generateQRs() {
  requestAnimationFrame(() => {
    document.querySelectorAll('.qr-wrap').forEach(wrap => {
      const url = wrap.dataset.qr;
      const container = wrap.querySelector('.qr-img');
      if (!url || !container || container.children.length > 0) return;
      try {
        new QRCode(container, {
          text: url,
          width: 61,   // ~16mm @ 96dpi
          height: 61,
          colorDark: '#000000',
          colorLight: '#ffffff',
          correctLevel: QRCode.CorrectLevel.M
        });
      } catch(e) { container.textContent = url; }
    });
  });
}

function buildSpaceBadge(spaceStr, floor, opts = {}) {
  if (!spaceStr) return '';
  const { valColor = '', lblColor = '', floorColor = '' } = opts;
  const valStyle  = valColor  ? ` style="color:${valColor}"` : '';
  const lblStyle  = lblColor  ? ` style="color:${lblColor}"` : '';
  const flrStyle  = floorColor ? ` style="color:${floorColor}"` : '';

  const spaces = spaceStr.split(',').map(s => s.trim()).filter(Boolean);
  const n = spaces.length;

  let inner = '';
  if (n === 1) {
    // 1個：大きく
    inner = `<div class="sp-val"${valStyle}>${spaces[0]}</div>`;
  } else if (n <= 3) {
    // 2〜3個：スラッシュ区切り・中サイズ
    inner = `<div class="sp-val-sm"${valStyle}>${spaces.join(' / ')}</div>`;
  } else if (n <= 6) {
    // 4〜6個：グリッド
    inner = `<div class="sp-val-grid">${spaces.map(s=>`<span${valStyle}>${s}</span>`).join('')}</div>`;
  } else {
    // 7個以上：件数＋ゾーン名
    const zone = detectZone(spaces);
    inner = `<div class="sp-count"${valStyle}>×${n}</div>${zone ? `<div class="sp-count-zone"${flrStyle}>${zone}</div>` : ''}`;
  }

  const floorHtml = floor && n <= 3 ? `<div class="sp-floor"${flrStyle}>${floor}</div>` : '';
  return `<div class="sp-badge"><div class="sp-lbl"${lblStyle}>Space</div>${inner}${floorHtml}</div>`;
}


function autoFitPages() {
  requestAnimationFrame(() => {
    document.querySelectorAll('.a5-page').forEach(page => {
      page.style.fontSize = '';
      if (page.scrollHeight <= page.offsetHeight + 2) return;
      let fontSize = 10;
      while (page.scrollHeight > page.offsetHeight + 2 && fontSize > 5.5) {
        fontSize -= 0.5;
        page.style.fontSize = fontSize + 'px';
      }
    });
  });
}


function deletePage(idx) {
  const page = pages[idx];
  if (page && page.docId && window.deleteGeneratorPageDoc) {
    window.deleteGeneratorPageDoc(page.docId);
    // renderAllはFirestoreのonSnapshotが検知して自動的に呼ばれる
  } else {
    pages.splice(idx, 1);
    renderAll();
  }
}

function cleanupAllPages() {
  if (pages.length === 0) { alert('削除するページがありません'); return; }
  const ok = confirm('表示中の全ページ（' + pages.length + '件）を一覧から削除しますか？');
  if (!ok) return;
  const docIds = pages.filter(p => p.docId).map(p => p.docId);
  docIds.forEach(docId => {
    if (window.deleteGeneratorPageDoc) window.deleteGeneratorPageDoc(docId);
  });
}

              <button onclick="changeBodySize(${i},-0.5)" style="width:20px;height:20px;background:#0a0a0a;border:1px solid #2a2a2a;border-radius:3px;color:#aaa;font-size:13px;cursor:pointer;line-height:1;">−</button>

              <button class="theme-mini-btn ${p.theme==='pop'?'active-theme':''}" onclick="changeTheme(${i},'pop')">🎨 ポップ</button>
              <button class="theme-mini-btn ${p.theme==='photo'?'active-theme':''}" onclick="changeTheme(${i},'photo')">🖼 フォト</button>
              <button class="theme-mini-btn ${p.theme==='grid'?'active-theme':''}" onclick="changeTheme(${i},'grid')">📐 グリッド</button>
              <button class="theme-mini-btn ${p.theme==='news'?'active-theme':''}" onclick="changeTheme(${i},'news')">📰 新聞</button>
            </div>
            <div class="theme-mini-row" style="margin-top:3px">
              <button class="theme-mini-btn ${p.theme==='collage'?'active-theme':''}" onclick="changeTheme(${i},'collage')">✂️ コラージュ</button>
              <button class="theme-mini-btn ${p.theme==='retro'?'active-theme':''}" onclick="changeTheme(${i},'retro')">📮 レトロ</button>
              <button class="theme-mini-btn ${p.theme==='horror'?'active-theme':''}" onclick="changeTheme(${i},'horror')">🩸 ホラー</button>
              <button class="theme-mini-btn ${p.theme==='gothic'?'active-theme':''}" onclick="changeTheme(${i},'gothic')">⛪ ゴシック</button>
              <button class="theme-mini-btn ${p.theme==='punk'?'active-theme':''}" onclick="changeTheme(${i},'punk')">⚡ パンク</button>
            </div>
          </div>
        </div>`).join('');

  const container = document.getElementById('pageContainer');
  container.innerHTML = total === 0
    ? `<div class="a4-sheet theme-default"><div class="a5-page a5-ja"><div class="empty-state"><div class="icon">✦</div><p>データを追加してください</p></div></div><div class="a5-divider"></div><div class="a5-page a5-en"><div class="empty-state"><div class="icon">✦</div><p>右側が英語訳になります</p></div></div></div>`

  autoFitPages();

}
